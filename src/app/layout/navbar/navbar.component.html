<nav class="fixed top-0 z-50 w-full bg-white border-b border-gray-200">
  <div class="px-4 py-3 flex justify-between items-center">

    <!-- IZQUIERDA -->
    <div class="flex items-center gap-3">
      <button (click)="toggleSidebar()"
              class="p-2 hover:bg-gray-100 rounded">
        ☰
      </button>

      <span class="font-semibold text-lg">Sistema Escuela</span>
    </div>

    <!-- DERECHA -->
    <div class="relative">

      <!-- AVATAR -->
      <button 
        (click)="toggleUserMenu()"
        class="w-10 h-10 flex items-center justify-center rounded-full border-2 border-brand text-brand hover:bg-brand hover:text-white transition shadow-sm"
      >
        <i class="fa-solid fa-user-graduate text-xl"></i>
      </button>

      <!-- DROPDOWN -->
      <div *ngIf="isUserMenuOpen"
           class="absolute right-0 mt-2 w-44 bg-[#F7F5F5] border border-gray-200 rounded shadow">

        <div class="px-4 py-2">
          <p class="text-sm font-medium">Usuario</p>
          <p class="text-xs text-gray-500">{{ emailUsuario }}</p>
        </div>

        <button (click)="logout()"
                class="w-full text-left px-4 py-2 hover:bg-gray-100">
        <i class="fas fa-sign-out-alt"></i>
          Cerrar sesión
        </button>

      </div>
    </div>

  </div>
</nav>
