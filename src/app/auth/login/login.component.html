<div class="min-h-screen flex items-center justify-center bg-neutral-primary-soft">
  
  <div class="w-full max-w-md p-8 bg-white border border-default rounded-2xl shadow-lg">
    <div class="w-24 h-24 mx-auto mb-4 flex items-center justify-center bg-white text-brand border border-brand rounded-full">
      <i class="fa-solid fa-user-tie fa-3x"></i>
    </div>
    <h2 class="text-2xl font-semibold text-center mb-6 text-heading">
      Iniciar sesión
    </h2>

    <form [formGroup]="form" (ngSubmit)="login()">

      <div class="mb-5">
        <label for="email" class="block mb-2 text-sm font-medium text-heading">
          Email
        </label>
        <input
          formControlName="email"
          type="email"
          id="email"
          class="w-full px-3 py-2.5 text-sm border rounded-lg bg-neutral-secondary-medium focus:ring-2 focus:ring-brand focus:border-brand"
          placeholder="name@flowbite.com"
        />
      </div>

      <div class="mb-6">
        <label for="password" class="block mb-2 text-sm font-medium text-heading">
          Contraseña
        </label>
        <input
          formControlName="password"
          type="password"
          id="password"
          class="w-full px-3 py-2.5 text-sm border rounded-lg bg-neutral-secondary-medium focus:ring-2 focus:ring-brand focus:border-brand"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full text-white bg-brand hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium font-medium rounded-lg text-sm px-4 py-2.5 transition"
      >
        Ingresar
      </button>

    </form>

  </div>

</div>
