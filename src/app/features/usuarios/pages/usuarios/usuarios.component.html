<div class="relative overflow-x-auto shadow-md sm:rounded-lg">

  <!-- HEADER + BUSCADOR -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4 p-4 bg-white dark:bg-gray-900">

    <h2 class="text-xl font-semibold text-gray-900 dark:text-white">
      Usuarios
    </h2>

    <div class="flex gap-2 w-full sm:w-auto">
      <input
        type="search"
        [(ngModel)]="search"
        (keyup.enter)="buscar()"
        placeholder="Buscar usuario..."
        class="w-full sm:w-64 px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-600 dark:text-white"
      />

      <button
        (click)="buscar()"
        class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">
        Buscar
      </button>
    </div>

    <span class="text-sm text-gray-500 dark:text-gray-400">
      Total: {{ totalRecords }}
    </span>

  </div>

  <!-- TABLA -->
  <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
    
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        
        <th class="px-6 py-3 cursor-pointer" (click)="ordenar('id')">
          ID
          <i *ngIf="sortBy === 'id'" class="ml-1"
             [ngClass]="sortDescending ? 'fa-solid fa-arrow-down' : 'fa-solid fa-arrow-up'">
          </i>
        </th>

        <th class="px-6 py-3 cursor-pointer" (click)="ordenar('nombres')">
          Nombre
          <i *ngIf="sortBy === 'nombres'" class="ml-1"
             [ngClass]="sortDescending ? 'fa-solid fa-arrow-down' : 'fa-solid fa-arrow-up'">
          </i>
        </th>

        <th class="px-6 py-3 cursor-pointer" (click)="ordenar('email')">
          Email
          <i *ngIf="sortBy === 'email'" class="ml-1"
             [ngClass]="sortDescending ? 'fa-solid fa-arrow-down' : 'fa-solid fa-arrow-up'">
          </i>
        </th>

        <th class="px-6 py-3 cursor-pointer" (click)="ordenar('telefono')">
          Telefono
          <i *ngIf="sortBy === 'telefono'" class="ml-1"
             [ngClass]="sortDescending ? 'fa-solid fa-arrow-down' : 'fa-solid fa-arrow-up'">
          </i>
        </th>

        <th class="px-6 py-3 cursor-pointer" (click)="ordenar('rol')">
          Rol
          <i *ngIf="sortBy === 'rol'" class="ml-1"
             [ngClass]="sortDescending ? 'fa-solid fa-arrow-down' : 'fa-solid fa-arrow-up'">
          </i>
        </th>

        <th class="px-6 py-3 cursor-pointer" (click)="ordenar('dni')">
          DNI
          <i *ngIf="sortBy === 'dni'" class="ml-1"
             [ngClass]="sortDescending ? 'fa-solid fa-arrow-down' : 'fa-solid fa-arrow-up'">
          </i>
        </th>

      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let user of usuarios"
          class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">

        <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">
          {{ user.id }}
        </td>

        <td class="px-6 py-4">
          {{ user.nombres }} {{ user.apellidos }}
        </td>

        <td class="px-6 py-4">
          {{ user.email }}
        </td>

        <td class="px-6 py-4">
          {{ user.telefono }}
        </td>

        <td class="px-6 py-4">
          <span 
            class="px-2 py-1 text-xs font-medium rounded"
            [ngClass]="{
              'bg-red-100 text-red-800': user.rol === 'ADMINISTRADOR',
              'bg-green-100 text-green-800': user.rol === 'ALUMNO',
              'bg-yellow-100 text-yellow-800': user.rol === 'PROFESOR',
              'bg-blue-100 text-blue-800': user.rol === 'RECTOR',
              'bg-orange-100 text-orange-800': user.rol === 'PRECEPTOR',
            }">
            {{ user.rol }}
          </span>
        </td>

        <td class="px-6 py-4">
          {{ user.dni }}
        </td>

      </tr>
    </tbody>
  </table>

  <!-- PAGINACIÓN -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-3 p-4 bg-white dark:bg-gray-900">

    <button 
      (click)="anteriorPagina()" 
      [disabled]="!hasPreviousPage"
      class="px-4 py-2 text-sm font-medium text-white bg-gray-800 rounded-lg hover:bg-gray-900 disabled:opacity-50 disabled:cursor-not-allowed">
      <i class="fa-solid fa-circle-arrow-left"></i> Anterior
    </button>

    <span class="text-sm text-gray-700 dark:text-gray-300">
      Página {{ page }} de {{ totalPages }}
    </span>

    <button 
      (click)="siguientePagina()" 
      [disabled]="!hasNextPage"
      class="px-4 py-2 text-sm font-medium text-white bg-gray-800 rounded-lg hover:bg-gray-900 disabled:opacity-50 disabled:cursor-not-allowed">
      Siguiente <i class="fa-solid fa-circle-arrow-right"></i>
    </button>

  </div>

</div>
